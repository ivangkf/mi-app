trigger: none

resources:
  pipelines:
    - pipeline: CI
    source: mi-app-CI
    trigger: true

pool:
  vmImage: ubuntu-latest

steps:
- task: Kubernetes@1
  displayName: Deploy a AKS
  inputs:
    connectionType: Azure Resource Manager
    azureSubscription: mi-conexion-Azure
    azureResourceGroup: mi-resource-group
    kubernetesCluster: mi-aks
    command: apply
    arguments: -f k8s/