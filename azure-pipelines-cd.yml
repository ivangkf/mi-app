trigger: none

resources:
  pipelines:
    - pipeline: CI
    source: mi-app-CI
    trigger: true

pool:
  vmImage: ubuntu-latest

steps:
- task: Kubernetes@1
  displayName: Deploy a AKS
  inputs:
    connectionType: 'Azure Resource Manager'
    azureSubscriptionEndpoint: 'mi-conexion-Azure'
    azureResourceGroup: 'mi-app-rg'
    kubernetesCluster: 'mi-aks'
    command: 'apply'
    arguments: '-f k8s/deployment.yaml -f k8s/service.yaml'